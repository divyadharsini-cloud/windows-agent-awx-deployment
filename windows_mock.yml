---
- name: Fix Security Awareness Windows Kiosk Launcher
  hosts: LMDULB3FAIT0019
  gather_facts: false

  vars:
    launcher_path: 'C:\ProgramData\SecurityAwareness\kiosk-launcher-windows.ps1'
    log_path: 'C:\ProgramData\SecurityAwareness\kiosk-launcher.log'

    backend_url: 'http://172.17.6.142:5000/api/awareness'
    awareness_page: 'http://172.17.6.142:5000/awareness.html'

  tasks:

    # =========================================================
    # Replace launcher with corrected URLs
    # =========================================================

    - name: Install corrected Security Awareness launcher
      ansible.windows.win_copy:
        dest: "{{ launcher_path }}"
        content: |
          $ErrorActionPreference = 'Continue'

          $LogFile = '{{ log_path }}'
          $BackendBase = '{{ backend_url }}'
          $AwarenessUrl = '{{ awareness_page }}'

          $PollSeconds = 2
          $ResultWaitSeconds = 8


          function Write-Log {
              param(
                  [string]$Message
              )

              $timestamp = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'

              Add-Content `
                  -Path $LogFile `
                  -Value "$timestamp $Message"
          }


          Write-Log '=============================================='
          Write-Log 'Security Awareness Kiosk launcher started'
          Write-Log "USER=$env:USERNAME"
          Write-Log "COMPUTER=$env:COMPUTERNAME"
          Write-Log '=============================================='


          # =====================================================
          # Wait for interactive desktop
          # =====================================================

          Write-Log 'Waiting for explorer.exe...'

          $timeout = 120
          $elapsed = 0

          while (-not (Get-Process explorer -ErrorAction SilentlyContinue)) {

              Start-Sleep -Seconds 2

              $elapsed += 2

              if ($elapsed -ge $timeout) {

                  Write-Log 'explorer.exe did not start within timeout'
                  exit 0
              }
          }

          Write-Log 'explorer.exe detected'
          Write-Log 'Interactive user session is available'


          # =====================================================
          # Hostname
          # =====================================================

          $hostname = $env:COMPUTERNAME

          Write-Log "Hostname=$hostname"


          # =====================================================
          # Backend status URL
          # =====================================================

          $statusUrl = "$BackendBase/status?hostname=$hostname"

          Write-Log "Checking backend: $statusUrl"


          # =====================================================
          # Initial backend check
          # =====================================================

          try {

              $response = Invoke-RestMethod `
                  -Uri $statusUrl `
                  -Method Get `
                  -TimeoutSec 2

              Write-Log "Backend response: completed=$($response.completed)"
          }
          catch {

              Write-Log "Backend unavailable: $($_.Exception.Message)"
              Write-Log 'Failing open - kiosk will not start'

              exit 0
          }


          # =====================================================
          # Already completed
          # =====================================================

          if ($response.completed -eq $true) {

              Write-Log 'Awareness already completed'
              Write-Log 'No kiosk required'

              exit 0
          }


          Write-Log 'Awareness NOT completed'
          Write-Log 'Kiosk is required'


          # =====================================================
          # Find Chrome
          # =====================================================

          $ChromePaths = @(
              'C:\Program Files\Google\Chrome\Application\chrome.exe',
              'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
          )

          $Chrome = $null

          foreach ($path in $ChromePaths) {

              if (Test-Path $path) {

                  $Chrome = $path
                  break
              }
          }


          if (-not $Chrome) {

              Write-Log 'Google Chrome was not found'
              Write-Log 'Failing open'

              exit 0
          }


          Write-Log "Chrome found: $Chrome"


          # =====================================================
          # Correct kiosk URL
          # =====================================================

          $KioskUrl = "$AwarenessUrl?host=$hostname"

          Write-Log "Kiosk URL: $KioskUrl"


          # =====================================================
          # Dedicated Chrome profile
          # =====================================================

          $ChromeProfile = 'C:\ProgramData\SecurityAwareness\ChromeProfile'

          New-Item `
              -ItemType Directory `
              -Path $ChromeProfile `
              -Force |
              Out-Null


          # =====================================================
          # Chrome arguments
          # =====================================================

          $ChromeArguments = @(
              '--kiosk',
              '--incognito',
              '--noerrdialogs',
              '--disable-session-crashed-bubble',
              '--disable-infobars',
              '--disable-pinch',
              '--overscroll-history-navigation=0',
              "--user-data-dir=$ChromeProfile",
              "$KioskUrl"
          )


          # =====================================================
          # Start Chrome
          # =====================================================

          Write-Log 'Starting Chrome kiosk'

          Start-Process `
              -FilePath $Chrome `
              -ArgumentList $ChromeArguments

          Write-Log 'Chrome kiosk started'


          # =====================================================
          # Monitor completion
          # =====================================================

          while ($true) {

              Start-Sleep -Seconds $PollSeconds


              # -------------------------------------------------
              # Check Chrome
              # -------------------------------------------------

              $ChromeProcess = Get-Process chrome -ErrorAction SilentlyContinue

              if (-not $ChromeProcess) {

                  Write-Log 'Chrome was closed'


                  try {

                      $response = Invoke-RestMethod `
                          -Uri $statusUrl `
                          -Method Get `
                          -TimeoutSec 2
                  }
                  catch {

                      Write-Log 'Backend unavailable after Chrome closed'
                      exit 0
                  }


                  if ($response.completed -eq $true) {

                      Write-Log 'Awareness completed'
                      exit 0
                  }


                  Write-Log 'Awareness still not completed'
                  Write-Log 'Relaunching Chrome'


                  Start-Process `
                      -FilePath $Chrome `
                      -ArgumentList $ChromeArguments

                  continue
              }


              # -------------------------------------------------
              # Check completion
              # -------------------------------------------------

              try {

                  $response = Invoke-RestMethod `
                      -Uri $statusUrl `
                      -Method Get `
                      -TimeoutSec 2


                  if ($response.completed -eq $true) {

                      Write-Log '=============================================='
                      Write-Log 'Awareness completed'
                      Write-Log "Keeping result visible for $ResultWaitSeconds seconds"
                      Write-Log '=============================================='


                      Start-Sleep -Seconds $ResultWaitSeconds


                      Write-Log 'Closing Chrome kiosk'


                      Get-Process chrome -ErrorAction SilentlyContinue |
                          Stop-Process -Force


                      Write-Log 'Chrome closed'
                      Write-Log 'Security Awareness completed'

                      exit 0
                  }

              }
              catch {

                  Write-Log "Backend check failed: $($_.Exception.Message)"

                  # Keep kiosk open if backend temporarily fails.
                  continue
              }
          }

      register: launcher_deploy

    # =========================================================
    # Verify the actual URLs written to the file
    # =========================================================

    - name: Verify launcher URLs
      ansible.builtin.raw: |
        powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ^
        "Write-Host '--- Backend URL ---'; ^
        Select-String -Path '{{ launcher_path }}' -Pattern 'BackendBase'; ^
        Write-Host '--- Awareness URL ---'; ^
        Select-String -Path '{{ launcher_path }}' -Pattern 'AwarenessUrl'; ^
        Write-Host '--- Launcher exists ---'; ^
        Write-Host (Test-Path '{{ launcher_path }}')"
      changed_when: false

    # =========================================================
    # Clear old log
    # =========================================================

    - name: Remove old kiosk log
      ansible.builtin.raw: |
        powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ^
        "Remove-Item '{{ log_path }}' -Force -ErrorAction SilentlyContinue"
      changed_when: true

    # =========================================================
    # Final message
    # =========================================================

    - name: Show fix result
      ansible.builtin.debug:
        msg:
          - "Security Awareness launcher fixed."
          - "Backend URL: {{ backend_url }}"
          - "Awareness page: {{ awareness_page }}"
          - "Hostname is appended automatically."
          - "No reboot required."

---
- name: Deploy Security Awareness Windows Kiosk
  hosts: LMDULB3FAIT0019
  gather_facts: false

  vars:
    kiosk_directory: 'C:\ProgramData\SecurityAwareness'
    launcher_path: 'C:\ProgramData\SecurityAwareness\kiosk-launcher-windows.ps1'
    task_script_path: 'C:\ProgramData\SecurityAwareness\create-kiosk-task.ps1'
    log_path: 'C:\ProgramData\SecurityAwareness\kiosk-launcher.log'

    scheduled_task_name: 'SecurityAwarenessKiosk'

    backend_url: 'http://172.17.6.142:5000/api/awareness'
    awareness_page: 'http://172.17.6.142:5000/awareness.html'

  tasks:

    # =========================================================
    # 1. Create application directory
    # =========================================================
    - name: Create Security Awareness directory
      ansible.builtin.raw: |
        powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ^
        "New-Item -ItemType Directory -Path '{{ kiosk_directory }}' -Force | Out-Null"
      changed_when: true


    # =========================================================
    # 2. Create Windows PowerShell kiosk launcher
    # =========================================================
    - name: Create kiosk launcher
      ansible.builtin.raw: |
        powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ^
        "$content = @'
        `$ErrorActionPreference = 'Continue'

        `$LogFile = '{{ log_path }}'
        `$Backend = '{{ backend_url }}'
        `$AwarenessPage = '{{ awareness_page }}'

        function Write-Log {
            param([string]`$Message)

            `$timestamp = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'

            Add-Content -Path `$LogFile `
                -Value "`$timestamp `$Message"
        }

        Write-Log '=============================================='
        Write-Log 'Security Awareness Kiosk launcher started'
        Write-Log "USER=`$env:USERNAME"
        Write-Log "COMPUTER=`$env:COMPUTERNAME"
        Write-Log '=============================================='


        # =====================================================
        # Wait for interactive Windows desktop
        # =====================================================

        Write-Log 'Waiting for explorer.exe...'

        `$timeout = 120
        `$elapsed = 0

        while (-not (Get-Process explorer -ErrorAction SilentlyContinue)) {

            Start-Sleep -Seconds 2

            `$elapsed += 2

            if (`$elapsed -ge `$timeout) {
                Write-Log 'explorer.exe did not start within timeout'
                exit 0
            }
        }

        Write-Log 'explorer.exe detected'
        Write-Log 'Interactive user session is available'


        # =====================================================
        # Get hostname
        # =====================================================

        `$hostname = `$env:COMPUTERNAME

        Write-Log "Hostname=`$hostname"


        # =====================================================
        # Backend status URL
        # =====================================================

        `$statusUrl = "`$Backend/status?hostname=`$hostname"

        Write-Log "Checking backend: `$statusUrl"


        # =====================================================
        # Initial backend check
        # =====================================================

        try {

            `$response = Invoke-RestMethod `
                -Uri `$statusUrl `
                -Method Get `
                -TimeoutSec 10

            Write-Log 'Backend response received'

        }
        catch {

            Write-Log "Backend unavailable: `$(`$_.Exception.Message)"
            Write-Log 'Failing open - kiosk will not start'
            exit 0
        }


        # =====================================================
        # Check completion status
        # =====================================================

        if (`$response.completed -eq `$true) {

            Write-Log 'Awareness already completed'
            Write-Log 'No kiosk required'

            exit 0
        }


        Write-Log 'Awareness NOT completed'
        Write-Log 'Kiosk is required'


        # =====================================================
        # Locate Google Chrome
        # =====================================================

        `$ChromePaths = @(
            'C:\Program Files\Google\Chrome\Application\chrome.exe',
            'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
        )

        `$Chrome = `$null

        foreach (`$path in `$ChromePaths) {

            if (Test-Path `$path) {

                `$Chrome = `$path
                break
            }
        }


        if (-not `$Chrome) {

            Write-Log 'Google Chrome was not found'
            Write-Log 'Exiting kiosk launcher'

            exit 0
        }


        Write-Log "Chrome found: `$Chrome"


        # =====================================================
        # Build awareness URL
        # =====================================================

        `$KioskUrl = "`$AwarenessPage?host=`$hostname"

        Write-Log "Kiosk URL: `$KioskUrl"


        # =====================================================
        # Chrome kiosk arguments
        # =====================================================

        `$ChromeArguments = @(
            '--kiosk',
            '--incognito',
            '--noerrdialogs',
            '--disable-session-crashed-bubble',
            '--disable-infobars',
            '--disable-pinch',
            '--overscroll-history-navigation=0',
            "`$KioskUrl"
        )


        # =====================================================
        # Start Chrome kiosk
        # =====================================================

        Write-Log 'Starting Chrome kiosk'

        Start-Process `
            -FilePath `$Chrome `
            -ArgumentList `$ChromeArguments

        Write-Log 'Chrome kiosk started'


        # =====================================================
        # Monitor awareness completion
        # =====================================================

        while (`$true) {

            Start-Sleep -Seconds 2


            # -------------------------------------------------
            # Check whether Chrome is still running
            # -------------------------------------------------

            `$ChromeProcess = Get-Process chrome -ErrorAction SilentlyContinue

            if (-not `$ChromeProcess) {

                Write-Log 'Chrome was closed'


                # -------------------------------------------------
                # Check backend before relaunching
                # -------------------------------------------------

                try {

                    `$response = Invoke-RestMethod `
                        -Uri `$statusUrl `
                        -Method Get `
                        -TimeoutSec 2

                }
                catch {

                    Write-Log 'Backend unavailable after Chrome closed'
                    Write-Log 'Exiting launcher'

                    exit 0
                }


                if (`$response.completed -eq `$true) {

                    Write-Log 'Awareness completed'
                    Write-Log 'No relaunch required'

                    exit 0
                }


                Write-Log 'Awareness still not completed'
                Write-Log 'Relaunching Chrome kiosk'


                Start-Process `
                    -FilePath `$Chrome `
                    -ArgumentList `$ChromeArguments

                Write-Log 'Chrome kiosk relaunched'

                continue
            }


            # -------------------------------------------------
            # Check backend completion
            # -------------------------------------------------

            try {

                `$response = Invoke-RestMethod `
                    -Uri `$statusUrl `
                    -Method Get `
                    -TimeoutSec 2


                if (`$response.completed -eq `$true) {

                    Write-Log '=============================================='
                    Write-Log 'Awareness completed'
                    Write-Log 'Keeping result visible for 8 seconds'
                    Write-Log '=============================================='


                    Start-Sleep -Seconds 8


                    # -------------------------------------------------
                    # Close Chrome
                    # -------------------------------------------------

                    Write-Log 'Closing Chrome kiosk'


                    Get-Process chrome -ErrorAction SilentlyContinue |
                        Stop-Process -Force


                    Write-Log 'Chrome closed'
                    Write-Log 'Security Awareness completed'

                    exit 0
                }

            }
            catch {

                Write-Log "Backend check failed: `$(`$_.Exception.Message)"

                # -------------------------------------------------
                # Temporary backend failure
                #
                # Keep Chrome open.
                # Do not close the kiosk.
                # -------------------------------------------------

                continue
            }
        }

        '@

        [System.IO.File]::WriteAllText(
            '{{ launcher_path }}',
            `$content,
            [System.Text.Encoding]::UTF8
        )"

      changed_when: true


    # =========================================================
    # 3. Create scheduled-task registration script
    # =========================================================
    - name: Create scheduled task script
      ansible.builtin.raw: |
        powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ^
        "$content = @'
        `$TaskName = '{{ scheduled_task_name }}'
        `$Launcher = '{{ launcher_path }}'

        Write-Host 'Creating Security Awareness scheduled task...'


        # =====================================================
        # Remove existing task
        # =====================================================

        schtasks.exe /Delete `
            /TN "`$TaskName" `
            /F 2>`$null


        # =====================================================
        # Create ONLOGON task
        #
        # The task starts after the Windows user logs in.
        # Chrome requires an interactive desktop session.
        # =====================================================

        `$taskCommand = `
            "powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"`$Launcher`""

        schtasks.exe /Create `
            /TN "`$TaskName" `
            /TR "`$taskCommand" `
            /SC ONLOGON `
            /RU "`$env:USERNAME" `
            /RL LIMITED `
            /F


        Write-Host 'Security Awareness scheduled task created successfully.'

        '@

        [System.IO.File]::WriteAllText(
            '{{ task_script_path }}',
            `$content,
            [System.Text.Encoding]::UTF8
        )"

      changed_when: true


    # =========================================================
    # 4. Register scheduled task
    # =========================================================
    - name: Register Security Awareness logon task
      ansible.builtin.raw: |
        powershell.exe -NoProfile -ExecutionPolicy Bypass -File "{{ task_script_path }}"
      changed_when: true


    # =========================================================
    # 5. Verify launcher exists
    # =========================================================
    - name: Verify kiosk launcher
      ansible.builtin.raw: |
        powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ^
        "if (Test-Path '{{ launcher_path }}') {
            Write-Host 'OK - kiosk launcher exists'
        }
        else {
            Write-Error 'ERROR - kiosk launcher missing'
            exit 1
        }"
      changed_when: false


    # =========================================================
    # 6. Verify scheduled task
    # =========================================================
    - name: Verify scheduled task
      ansible.builtin.raw: |
        schtasks.exe /Query /TN "{{ scheduled_task_name }}" /V /FO LIST
      changed_when: false


    # =========================================================
    # 7. Final verification
    # =========================================================
    - name: Deployment summary
      ansible.builtin.raw: |
        powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ^
        "Write-Host ''
        Write-Host '=============================================='
        Write-Host ' Security Awareness Kiosk Deployment'
        Write-Host '=============================================='
        Write-Host ''
        Write-Host 'Launcher : {{ launcher_path }}'
        Write-Host 'Task     : {{ scheduled_task_name }}'
        Write-Host 'Trigger  : ONLOGON'
        Write-Host 'Backend  : {{ backend_url }}'
        Write-Host 'Page     : {{ awareness_page }}'
        Write-Host ''
        Write-Host 'Behavior:'
        Write-Host '  Windows boots/restarts'
        Write-Host '        -> user logs in'
        Write-Host '        -> explorer.exe starts'
        Write-Host '        -> kiosk launcher executes'
        Write-Host '        -> backend status is checked'
        Write-Host '        -> Chrome kiosk opens if required'
        Write-Host '        -> awareness is completed'
        Write-Host '        -> wait 8 seconds'
        Write-Host '        -> Chrome closes'
        Write-Host ''
        Write-Host 'Backend unavailable -> fail open'
        Write-Host 'Chrome unavailable  -> fail open'
        Write-Host '=============================================='"
      changed_when: false

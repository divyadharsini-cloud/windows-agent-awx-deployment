---
- name: Deploy Security Awareness Kiosk on Windows
  hosts: LMDULB3FAIT0019
  gather_facts: false

  vars:
    kiosk_directory: 'C:\ProgramData\SecurityAwareness'
    launcher_path: 'C:\ProgramData\SecurityAwareness\kiosk-launcher-windows.ps1'
    scheduled_task_name: 'SecurityAwarenessKiosk'

    backend_base: 'http://172.17.6.142:5000/api/awareness'
    awareness_url: 'http://172.17.6.142:5000/awareness.html'

    # The actual launcher script, as a plain block of text — no quoting
    # tricks needed here since it's just normal YAML, not a shell string.
    kiosk_script_content: |
      $BackendBase = '{{ backend_base }}'
      $AwarenessUrl = '{{ awareness_url }}'

      $PollSeconds = 2
      $ResultWaitSeconds = 8

      $LogFile = 'C:\ProgramData\SecurityAwareness\kiosk-launcher.log'

      function Write-Log($Message) {
          $Timestamp = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'
          Add-Content -Path $LogFile -Value "$Timestamp - $Message"
      }

      Write-Log '=========================================='
      Write-Log 'Security Awareness Kiosk starting'
      Write-Log "Computer=$env:COMPUTERNAME"
      Write-Log "User=$env:USERNAME"
      Write-Log '=========================================='

      # --- Wait for the desktop shell (explorer.exe) ---
      Write-Log 'Waiting for explorer.exe...'
      $Count = 0
      while (-not (Get-Process explorer -ErrorAction SilentlyContinue) -and $Count -lt 60) {
          Start-Sleep -Seconds 1
          $Count++
      }
      if (-not (Get-Process explorer -ErrorAction SilentlyContinue)) {
          Write-Log 'ERROR: explorer.exe not found.'
          exit 0
      }
      Write-Log 'explorer.exe detected.'

      # --- Machine identity ---
      $Hostname = $env:COMPUTERNAME
      Write-Log "Hostname=$Hostname"

      $IP = Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue |
          Where-Object { $_.IPAddress -notlike '169.254.*' -and $_.IPAddress -ne '127.0.0.1' } |
          Select-Object -First 1 -ExpandProperty IPAddress
      if (-not $IP) { $IP = 'unknown' }
      Write-Log "IP=$IP"

      $LaunchUrl = "$AwarenessUrl?host=$Hostname&ip=$IP"
      Write-Log "Launch URL=$LaunchUrl"

      # --- Check completion status before launching ---
      Write-Log 'Checking backend...'
      try {
          $Status = Invoke-RestMethod -Uri "$BackendBase/status?hostname=$Hostname" -Method Get -TimeoutSec 10 -ErrorAction Stop
          Write-Log "Backend response received. Completed=$($Status.completed)"
      } catch {
          Write-Log "ERROR: Backend unavailable. $($_.Exception.Message)"
          Write-Log 'Kiosk will not launch.'
          exit 0
      }

      if ($Status.completed -eq $true) {
          Write-Log 'Awareness test already completed. Kiosk will not launch.'
          exit 0
      }

      # --- Find Chrome ---
      $ChromePaths = @(
          'C:\Program Files\Google\Chrome\Application\chrome.exe',
          'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe',
          "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
      )
      $Chrome = $ChromePaths | Where-Object { Test-Path $_ } | Select-Object -First 1

      if (-not $Chrome) {
          Write-Log 'ERROR: Chrome not found.'
          exit 0
      }
      Write-Log "Chrome found: $Chrome"

      # --- Launch Chrome ---
      Write-Log 'Launching Security Awareness kiosk...'
      try {
          $ChromeProcess = Start-Process -FilePath $Chrome -ArgumentList @(
              '--kiosk', '--incognito', '--noerrdialogs', '--disable-pinch',
              '--disable-session-crashed-bubble', $LaunchUrl
          ) -PassThru
          Write-Log "Chrome started. PID=$($ChromeProcess.Id)"
      } catch {
          Write-Log "ERROR: Chrome failed to start. $($_.Exception.Message)"
          exit 0
      }

      # --- Monitor completion ---
      while ($true) {
          Start-Sleep -Seconds $PollSeconds

          try {
              $Status = Invoke-RestMethod -Uri "$BackendBase/status?hostname=$Hostname" -Method Get -TimeoutSec 10 -ErrorAction Stop
          } catch {
              Write-Log 'Backend check failed temporarily.'
              continue
          }

          if ($Status.completed -eq $true) {
              Write-Log "Awareness test completed. Waiting $ResultWaitSeconds seconds."
              Start-Sleep -Seconds $ResultWaitSeconds

              if (-not $ChromeProcess.HasExited) {
                  Write-Log 'Closing Chrome.'
                  Stop-Process -Id $ChromeProcess.Id -Force -ErrorAction SilentlyContinue
              }

              Write-Log 'Kiosk finished.'
              exit 0
          }

          if ($ChromeProcess.HasExited) {
              Write-Log 'Chrome was closed before completion. Launching again.'
              try {
                  $ChromeProcess = Start-Process -FilePath $Chrome -ArgumentList @(
                      '--kiosk', '--incognito', '--noerrdialogs', '--disable-pinch',
                      '--disable-session-crashed-bubble', $LaunchUrl
                  ) -PassThru
                  Write-Log "Chrome relaunched. PID=$($ChromeProcess.Id)"
              } catch {
                  Write-Log 'ERROR: Chrome could not be relaunched.'
                  Start-Sleep -Seconds 5
              }
          }
      }

  tasks:

    # ------------------------------------------------------------
    # 1. Create Security Awareness directory
    # ------------------------------------------------------------

    - name: Create Security Awareness directory
      ansible.builtin.raw: >-
        powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
        -Command "New-Item -ItemType Directory -Path '{{ kiosk_directory }}' -Force | Out-Null"

    # ------------------------------------------------------------
    # 2. Write the launcher script
    #
    # The script is base64-encoded to avoid quoting/escaping
    # problems, but a single command with the WHOLE base64 string
    # is too long for cmd.exe's ~8191 character limit. So it's
    # split into small chunks, appended to a temp file across
    # several commands, then decoded in one final step.
    # ------------------------------------------------------------

    - name: Compute base64-encoded launcher content
      ansible.builtin.set_fact:
        b64_content: "{{ kiosk_script_content | b64encode }}"

    - name: Compute number of chunks needed
      ansible.builtin.set_fact:
        b64_chunk_size: 2000
        b64_chunk_count: "{{ ((b64_content | length) / 2000) | round(0, 'ceil') | int }}"

    - name: Clear any existing temp base64 file
      ansible.builtin.raw: >-
        powershell.exe -NoProfile -NonInteractive -Command
        "Remove-Item -Path '{{ kiosk_directory }}\launcher.b64' -ErrorAction SilentlyContinue"
      failed_when: false

    - name: Write base64 chunks to a temp file
      ansible.builtin.raw: >-
        powershell.exe -NoProfile -NonInteractive -Command
        "Add-Content -Path '{{ kiosk_directory }}\launcher.b64' -NoNewline -Value '{{ b64_content[item|int * 2000 : (item|int + 1) * 2000] }}'"
      loop: "{{ range(0, b64_chunk_count | int) | list }}"

    - name: Decode the temp file into the real launcher script
      ansible.builtin.raw: >-
        powershell.exe -NoProfile -NonInteractive -Command
        "[IO.File]::WriteAllText('{{ launcher_path }}',
        [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String((Get-Content -Path '{{ kiosk_directory }}\launcher.b64' -Raw))))"

    - name: Remove the temp base64 file
      ansible.builtin.raw: >-
        powershell.exe -NoProfile -NonInteractive -Command
        "Remove-Item -Path '{{ kiosk_directory }}\launcher.b64' -ErrorAction SilentlyContinue"
      failed_when: false

    # ------------------------------------------------------------
    # 3. Remove any old scheduled task before recreating it
    # ------------------------------------------------------------

    - name: Remove old Security Awareness scheduled task
      ansible.builtin.raw: >-
        schtasks.exe /Delete /TN "{{ scheduled_task_name }}" /F
      failed_when: false

    # ------------------------------------------------------------
    # 4. Create the scheduled task
    #
    # Primary attempt: fire once at BOOT, run inside the first
    # interactive user's session (/RU + /IT). This matches
    # "not on every login" — it only waits for the FIRST logon
    # after a boot, not each subsequent one.
    #
    # NOTE: /IT + a group account can behave inconsistently across
    # Windows versions. If verification (task 6) shows the task
    # was not created successfully, comment this task out and
    # uncomment the ONLOGON fallback below instead — the script's
    # own completion check still prevents it from reopening once
    # done, so ONLOGON remains a safe fallback even though it
    # technically fires at every login.
    # ------------------------------------------------------------

    - name: Create Security Awareness boot task (fires once, first interactive user)
      ansible.builtin.raw: >-
        schtasks.exe /Create /TN "{{ scheduled_task_name }}" /SC ONSTART
        /RU "BUILTIN\Users" /IT
        /TR "powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File \"{{ launcher_path }}\""
        /F

    # --- Fallback (fires at every logon, but harmless due to the
    #     completion check inside the script) — uncomment if the
    #     task above fails to register or fails to fire in testing:
    #
    # - name: Create Security Awareness logon task (fallback)
    #   ansible.builtin.raw: >-
    #     schtasks.exe /Create /TN "{{ scheduled_task_name }}" /SC ONLOGON
    #     /TR "powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File \"{{ launcher_path }}\""
    #     /F

    # ------------------------------------------------------------
    # 5. Verify launcher exists
    # ------------------------------------------------------------

    - name: Verify launcher exists
      ansible.builtin.raw: >-
        powershell.exe -NoProfile -NonInteractive -Command
        "if (Test-Path '{{ launcher_path }}') { Write-Output 'LAUNCHER_EXISTS=True' } else { Write-Output 'LAUNCHER_EXISTS=False'; exit 1 }"
      register: launcher_check

    # ------------------------------------------------------------
    # 6. Verify scheduled task
    # ------------------------------------------------------------

    - name: Verify scheduled task
      ansible.builtin.raw: >-
        schtasks.exe /Query /TN "{{ scheduled_task_name }}"
      register: task_check
      failed_when: false

    # ------------------------------------------------------------
    # 7. Verify Chrome is installed
    # ------------------------------------------------------------

    - name: Verify Chrome
      ansible.builtin.raw: >-
        powershell.exe -NoProfile -NonInteractive -Command
        "$ChromePaths = @('C:\Program Files\Google\Chrome\Application\chrome.exe', 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe', \"$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe\");
        $Chrome = $ChromePaths | Where-Object { Test-Path $_ } | Select-Object -First 1;
        if ($Chrome) { Write-Output \"CHROME_EXISTS=True\"; Write-Output \"CHROME_PATH=$Chrome\" } else { Write-Output 'CHROME_EXISTS=False'; exit 1 }"
      register: chrome_check
      failed_when: false

    # ------------------------------------------------------------
    # 8. Final result
    # ------------------------------------------------------------

    - name: Display deployment result
      ansible.builtin.debug:
        msg:
          - "Security Awareness Kiosk deployment completed."
          - "Launcher: {{ launcher_path }}"
          - "Launcher check: {{ launcher_check.stdout | default('unknown') }}"
          - "Scheduled Task: {{ scheduled_task_name }}"
          - "Task check: {{ task_check.stdout | default('not found') }}"
          - "Chrome check: {{ chrome_check.stdout | default('not found') }}"
          - "Trigger: Boot, first interactive user (BUILTIN\\Users + /IT)"
          - "Backend: {{ backend_base }}"
          - "Awareness URL: {{ awareness_url }}"
          - "Polling interval: 2 seconds"
          - "Result wait: 8 seconds"
          - "Log: C:\\ProgramData\\SecurityAwareness\\kiosk-launcher.log"

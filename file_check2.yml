---
- name: Verify AuroSphere Patch Package
  hosts: DPDYPHGFDAY0536
  gather_facts: false

  tasks:

    - name: Calculate SHA256 of KB5121003
      ansible.windows.win_shell: |
        Get-FileHash `
          "C:\ProgramData\windows-agent-patch\patch\downloads\KB5121003.bin" `
          -Algorithm SHA256
      register: patch_hash
      changed_when: false

    - name: Display SHA256
      debug:
        var: patch_hash.stdout_lines

    - name: Check patch agent service
      ansible.windows.win_shell: |
        Get-Service -Name "windows-agent-patch" |
        Select-Object Name, Status, StartType |
        Format-Table -AutoSize
      register: service_status
      changed_when: false

    - name: Display service status
      debug:
        var: service_status.stdout_lines

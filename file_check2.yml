---
- name: Verify AuroSphere Patch Installation
  hosts: DPDYPHGFDAY0536
  gather_facts: false

  tasks:

    # --------------------------------------------------
    # 1. Confirm downloaded package
    # --------------------------------------------------

    - name: Check downloaded KB5121003 package
      ansible.windows.win_stat:
        path: 'C:\ProgramData\windows-agent-patch\patch\downloads\KB5121003.bin'
      register: patch_file

    # --------------------------------------------------
    # 2. Check Windows installed KB
    # --------------------------------------------------

    - name: Check KB5121003 installation
      ansible.windows.win_shell: |
        $patch = Get-HotFix -Id KB5121003 -ErrorAction SilentlyContinue

        if ($patch) {
            Write-Output "STATUS: INSTALLED"
            Write-Output "KB: $($patch.HotFixID)"
            Write-Output "Installed On: $($patch.InstalledOn)"
            Write-Output "Description: $($patch.Description)"
        }
        else {
            Write-Output "STATUS: NOT INSTALLED"
        }
      register: hotfix
      changed_when: false

    # --------------------------------------------------
    # 3. Check DISM package state
    # --------------------------------------------------

    - name: Check Windows component package
      ansible.windows.win_shell: |
        dism.exe /online /get-packages |
        Select-String "KB5121003"

        if ($LASTEXITCODE -ne 0) {
            Write-Output "No DISM package information found for KB5121003"
        }
      register: dism_result
      changed_when: false

    # --------------------------------------------------
    # 4. Check whether reboot is pending
    # --------------------------------------------------

    - name: Check pending reboot
      ansible.windows.win_shell: |
        $pending = $false

        if (Test-Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending") {
            $pending = $true
        }

        if (Test-Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired") {
            $pending = $true
        }

        if ($pending) {
            Write-Output "REBOOT STATUS: PENDING"
        }
        else {
            Write-Output "REBOOT STATUS: NOT PENDING"
        }
      register: reboot
      changed_when: false

    # --------------------------------------------------
    # 5. Display final result
    # --------------------------------------------------

    - name: Display patch verification result
      debug:
        msg:
          - "=============================================="
          - "AuroSphere Patch Verification"
          - "=============================================="
          - "Package exists : {{ patch_file.stat.exists | default(false) }}"
          - "Package size   : {{ ((patch_file.stat.size | default(0)) / 1073741824) | round(2) }} GB"
          - "Installation   : {{ hotfix.stdout_lines }}"
          - "DISM status    : {{ dism_result.stdout_lines }}"
          - "Reboot status  : {{ reboot.stdout_lines }}"
          - "=============================================="

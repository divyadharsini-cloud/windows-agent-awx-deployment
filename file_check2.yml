---
- name: Diagnose AuroSphere Patch Download
  hosts: DPDYPHGFDAY0536
  gather_facts: false

  tasks:

    - name: Check AuroSphere services
      ansible.windows.win_shell: |
        Get-Service -Name "windows-agent","windows-agent-patch" -ErrorAction SilentlyContinue |
        Select-Object Name, Status, StartType |
        Format-Table -AutoSize
      register: services
      changed_when: false

    - name: Display service status
      debug:
        var: services.stdout_lines

    - name: Check running AuroSphere processes
      ansible.windows.win_shell: |
        Get-CimInstance Win32_Process |
        Where-Object {
          $_.Name -match 'windows-agent|custom-agent'
        } |
        Select-Object ProcessId, Name, ExecutablePath, CommandLine |
        Format-List
      register: processes
      changed_when: false

    - name: Display running processes
      debug:
        var: processes.stdout_lines

    - name: Check KB5121003 partial file
      ansible.windows.win_shell: |
        $file = "C:\ProgramData\windows-agent-patch\patch\downloads\KB5121003.bin.part"

        if (Test-Path $file) {
            $item = Get-Item $file

            Write-Output "File exists : True"
            Write-Output "Size bytes  : $($item.Length)"
            Write-Output "Size GB     : $([math]::Round($item.Length / 1GB, 2))"
            Write-Output "Modified    : $($item.LastWriteTime)"
        }
        else {
            Write-Output "File exists : False"
        }
      register: patch_file
      changed_when: false

    - name: Display patch file status
      debug:
        var: patch_file.stdout_lines

    - name: Check active connections to PatchMaster
      ansible.windows.win_shell: |
        Get-NetTCPConnection -RemoteAddress 172.17.9.50 -RemotePort 8443 -ErrorAction SilentlyContinue |
        Select-Object LocalAddress, LocalPort, RemoteAddress, RemotePort, State, OwningProcess |
        Format-Table -AutoSize
      register: connections
      changed_when: false

    - name: Display PatchMaster connections
      debug:
        var: connections.stdout_lines

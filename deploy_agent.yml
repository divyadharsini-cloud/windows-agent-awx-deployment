---
- name: Deploy AuroSphere Windows Agent - Patch Enabled
  hosts: DPDYPH1FGLA0619
  gather_facts: false

  vars:
    # ============================================
    # New AuroSphere Patch Agent
    # ============================================

    agent_install_dir: 'C:\Program Files\CustomAgent\windows-agent-patch'
    agent_exe: 'C:\Program Files\CustomAgent\windows-agent-patch\windows-agent-patch.exe'

    agent_data_dir: 'C:\ProgramData\windows-agent-patch'
    agent_log_dir: 'C:\ProgramData\windows-agent-patch\logs'
    agent_config: 'C:\ProgramData\windows-agent-patch\config.yaml'

    # AuroSphere tray
    tray_exe: 'C:\Program Files\CustomAgent\windows-agent-patch\aurosphere-tray.exe'
    assets_dir: 'C:\Program Files\CustomAgent\windows-agent-patch\assets'
    logo_file: 'C:\Program Files\CustomAgent\windows-agent-patch\assets\aurosphere.ico'

    # Patch directories
    agent_patch_dir: 'C:\ProgramData\windows-agent-patch\patch'
    agent_patch_download_dir: 'C:\ProgramData\windows-agent-patch\patch\downloads'

    # New service
    agent_service_name: 'windows-agent-patch'
    agent_display_name: 'Windows Custom Agent'

    # Old service
    old_agent_service_name: 'windows-agent'

  tasks:

    # ============================================
    # 1. Stop OLD agent
    # ============================================

    - name: Stop old Windows Agent service
      ansible.windows.win_service:
        name: "{{ old_agent_service_name }}"
        state: stopped
      failed_when: false

    # ============================================
    # 2. Create NEW directories
    # ============================================

    - name: Create AuroSphere agent installation directory
      ansible.windows.win_file:
        path: "{{ agent_install_dir }}"
        state: directory

    - name: Create AuroSphere assets directory
      ansible.windows.win_file:
        path: "{{ assets_dir }}"
        state: directory

    - name: Create agent ProgramData directory
      ansible.windows.win_file:
        path: "{{ agent_data_dir }}"
        state: directory

    - name: Create agent log directory
      ansible.windows.win_file:
        path: "{{ agent_log_dir }}"
        state: directory

    - name: Create patch directory
      ansible.windows.win_file:
        path: "{{ agent_patch_dir }}"
        state: directory

    - name: Create patch download directory
      ansible.windows.win_file:
        path: "{{ agent_patch_download_dir }}"
        state: directory

    # ============================================
    # 3. Copy NEW agent
    # ============================================

    - name: Copy AuroSphere patch agent executable
      ansible.windows.win_copy:
        src: windows-agent-patch.exe
        dest: "{{ agent_exe }}"
        force: true

    # ============================================
    # 4. Copy configuration
    # ============================================

    - name: Copy AuroSphere agent configuration
      ansible.windows.win_copy:
        src: config.yaml
        dest: "{{ agent_config }}"
        force: true

    # ============================================
    # 5. Copy AuroSphere tray
    # ============================================

    - name: Copy AuroSphere tray executable
      ansible.windows.win_copy:
        src: aurosphere-tray.exe
        dest: "{{ tray_exe }}"
        force: true

    - name: Copy AuroSphere logo
      ansible.windows.win_copy:
        src: aurosphere.ico
        dest: "{{ logo_file }}"
        force: true

    # ============================================
    # 6. Configure AuroSphere tray startup
    # ============================================

    - name: Configure AuroSphere tray to start at user logon
      ansible.windows.win_regedit:
        path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
        name: 'AuroSphere Agent'
        data: '"{{ tray_exe }}"'
        type: string

    # ============================================
    # 7. Install / update NEW Windows service
    # ============================================

    - name: Install and start AuroSphere patch agent service
      ansible.windows.win_service:
        name: "{{ agent_service_name }}"
        display_name: "{{ agent_display_name }}"
        description: "AuroSphere Windows Agent - Patch Enabled"
        path: '"{{ agent_exe }}"'
        start_mode: auto
        state: started
        username: LocalSystem

    # ============================================
    # 8. Verify NEW service
    # ============================================

    - name: Verify AuroSphere patch agent service
      ansible.windows.win_service:
        name: "{{ agent_service_name }}"
      register: agent_service

    # ============================================
    # 9. Verify files
    # ============================================

    - name: Verify AuroSphere agent executable
      ansible.windows.win_stat:
        path: "{{ agent_exe }}"
      register: agent_exe_check

    - name: Verify AuroSphere configuration
      ansible.windows.win_stat:
        path: "{{ agent_config }}"
      register: agent_config_check

    - name: Verify AuroSphere tray executable
      ansible.windows.win_stat:
        path: "{{ tray_exe }}"
      register: tray_exe_check

    - name: Verify AuroSphere logo
      ansible.windows.win_stat:
        path: "{{ logo_file }}"
      register: logo_check

    # ============================================
    # 10. Verify NEW process
    # ============================================

    - name: Verify AuroSphere agent process
      ansible.windows.win_shell: |
        Get-Process -Name "windows-agent-patch" -ErrorAction SilentlyContinue |
        Select-Object Id, ProcessName, Path
      register: agent_process
      changed_when: false

    # ============================================
    # 11. Verify OLD service is stopped
    # ============================================

    - name: Verify old Windows Agent service is stopped
      ansible.windows.win_service:
        name: "{{ old_agent_service_name }}"
      register: old_agent_service
      failed_when: false

    # ============================================
    # 12. Final result
    # ============================================

    - name: Display deployment result
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "AuroSphere Agent Deployment Result"
          - "=========================================="
          - "Old service        : {{ old_agent_service.state | default('not found') }}"
          - "New service        : {{ agent_service.name }}"
          - "New service state  : {{ agent_service.state }}"
          - "Start mode         : {{ agent_service.start_mode }}"
          - "Agent EXE exists   : {{ agent_exe_check.stat.exists }}"
          - "Config exists      : {{ agent_config_check.stat.exists }}"
          - "Tray exists        : {{ tray_exe_check.stat.exists }}"
          - "Logo exists        : {{ logo_check.stat.exists }}"
          - "Agent process      : {{ agent_process.stdout_lines }}"
          - "=========================================="

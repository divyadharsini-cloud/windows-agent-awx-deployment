---
- name: Configure Security Awareness Kiosk for all Linux GUI users
  hosts: ansibletesting
  become: true
  gather_facts: true

  vars:
    kiosk_dir: /opt/security-awareness
    launcher_path: /opt/security-awareness/kiosk-launcher-linux.sh
    desktop_file: /etc/xdg/autostart/security-awareness-kiosk.desktop
    backend_base: "http://172.17.6.142:5000/api/awareness"
    awareness_page: "http://172.17.6.142:5000/awareness.html"

  tasks:

    - name: Create kiosk directory
      ansible.builtin.file:
        path: "{{ kiosk_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Remove previous user-specific LightDM autologin configuration
      ansible.builtin.file:
        path: /etc/lightdm/lightdm.conf.d/90-security-awareness-autologin.conf
        state: absent

    - name: Create security awareness launcher
      ansible.builtin.copy:
        dest: "{{ launcher_path }}"
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash

          BACKEND_BASE="{{ backend_base }}"
          AWARENESS_PAGE="{{ awareness_page }}"

          LOG="/tmp/security-awareness-kiosk-${UID}.log"

          log()
          {
              echo "$(date '+%Y-%m-%d %H:%M:%S') $*" >> "$LOG"
          }

          log "Security Awareness kiosk launcher started"

          # ---------------------------------------------------------
          # Find the graphical desktop session belonging to this user
          # ---------------------------------------------------------

          DISPLAY_FOUND=""
          XAUTHORITY_FOUND=""

          SESSION_PROCS="xfce4-session cinnamon-session gnome-session mate-session"

          for PROC_NAME in $SESSION_PROCS; do

              for PID in $(pgrep -u "$UID" -x "$PROC_NAME" 2>/dev/null); do

                  if [ -r "/proc/$PID/environ" ]; then

                      PROC_DISPLAY=$(tr '\0' '\n' < "/proc/$PID/environ" 2>/dev/null \
                          | sed -n 's/^DISPLAY=//p' \
                          | head -n 1)

                      PROC_XAUTHORITY=$(tr '\0' '\n' < "/proc/$PID/environ" 2>/dev/null \
                          | sed -n 's/^XAUTHORITY=//p' \
                          | head -n 1)

                      if [ -n "$PROC_DISPLAY" ]; then
                          DISPLAY_FOUND="$PROC_DISPLAY"
                          XAUTHORITY_FOUND="$PROC_XAUTHORITY"
                          break 2
                      fi

                  fi

              done

          done

          # ---------------------------------------------------------
          # Fallback to current environment
          # ---------------------------------------------------------

          if [ -z "$DISPLAY_FOUND" ] && [ -n "$DISPLAY" ]; then
              DISPLAY_FOUND="$DISPLAY"
          fi

          if [ -z "$XAUTHORITY_FOUND" ] && [ -n "$XAUTHORITY" ]; then
              XAUTHORITY_FOUND="$XAUTHORITY"
          fi

          # ---------------------------------------------------------
          # Final XAUTHORITY fallback
          # ---------------------------------------------------------

          if [ -z "$XAUTHORITY_FOUND" ]; then
              XAUTHORITY_FOUND="$HOME/.Xauthority"
          fi

          if [ -z "$DISPLAY_FOUND" ]; then
              log "No graphical DISPLAY found. Exiting."
              exit 0
          fi

          export DISPLAY="$DISPLAY_FOUND"
          export XAUTHORITY="$XAUTHORITY_FOUND"

          log "Using DISPLAY=$DISPLAY"
          log "Using XAUTHORITY=$XAUTHORITY"

          # ---------------------------------------------------------
          # Make sure curl exists
          # ---------------------------------------------------------

          if ! command -v curl >/dev/null 2>&1; then
              log "curl not installed. Exiting."
              exit 0
          fi

          # ---------------------------------------------------------
          # Identify hostname
          # ---------------------------------------------------------

          HOSTNAME_VALUE="$(hostname)"

          STATUS_URL="${BACKEND_BASE}/status?hostname=${HOSTNAME_VALUE}"

          log "Checking completion status"
          log "STATUS_URL=$STATUS_URL"

          # ---------------------------------------------------------
          # Initial status check
          #
          # If backend cannot be reached, fail open.
          # The user is NOT locked out.
          # ---------------------------------------------------------

          STATUS_RESPONSE=$(curl \
              --silent \
              --show-error \
              --connect-timeout 2 \
              --max-time 2 \
              "$STATUS_URL" 2>/dev/null)

          CURL_RESULT=$?

          if [ "$CURL_RESULT" -ne 0 ]; then
              log "Backend unavailable. Exiting without launching kiosk."
              exit 0
          fi

          log "Backend response: $STATUS_RESPONSE"

          # ---------------------------------------------------------
          # If already completed, do nothing
          # ---------------------------------------------------------

          if echo "$STATUS_RESPONSE" | grep -q '"completed"[[:space:]]*:[[:space:]]*true'; then
              log "Security awareness already completed."
              log "Firefox will NOT be launched."
              exit 0
          fi

          # ---------------------------------------------------------
          # Check Firefox
          # ---------------------------------------------------------

          FIREFOX="$(command -v firefox 2>/dev/null)"

          if [ -z "$FIREFOX" ]; then
              log "Firefox not installed. Exiting."
              exit 0
          fi

          # ---------------------------------------------------------
          # Dedicated Firefox profile
          # This does not modify the user's normal Firefox profile.
          # ---------------------------------------------------------

          PROFILE_DIR="$HOME/.security-awareness-firefox"

          mkdir -p "$PROFILE_DIR"

          # ---------------------------------------------------------
          # Launch kiosk
          # ---------------------------------------------------------

          KIOSK_URL="${AWARENESS_PAGE}?host=${HOSTNAME_VALUE}"

          log "Launching Firefox kiosk"
          log "URL=$KIOSK_URL"

          "$FIREFOX" \
              --no-remote \
              --new-instance \
              --profile "$PROFILE_DIR" \
              --kiosk \
              "$KIOSK_URL" >/dev/null 2>&1 &

          FIREFOX_PID=$!

          log "Firefox PID=$FIREFOX_PID"

          # ---------------------------------------------------------
          # Poll backend every 2 seconds
          # ---------------------------------------------------------

          while kill -0 "$FIREFOX_PID" 2>/dev/null; do

              sleep 2

              STATUS_RESPONSE=$(curl \
                  --silent \
                  --show-error \
                  --connect-timeout 2 \
                  --max-time 2 \
                  "$STATUS_URL" 2>/dev/null)

              CURL_RESULT=$?

              if [ "$CURL_RESULT" -ne 0 ]; then
                  log "Backend temporarily unavailable. Continuing."
                  continue
              fi

              log "Status: $STATUS_RESPONSE"

              if echo "$STATUS_RESPONSE" | grep -q '"completed"[[:space:]]*:[[:space:]]*true'; then

                  log "Security awareness completed."
                  log "Keeping result visible for 8 seconds."

                  sleep 8

                  # -------------------------------------------------
                  # Close ONLY this kiosk Firefox process
                  # -------------------------------------------------

                  if kill -0 "$FIREFOX_PID" 2>/dev/null; then
                      kill "$FIREFOX_PID" 2>/dev/null
                      sleep 2
                  fi

                  if kill -0 "$FIREFOX_PID" 2>/dev/null; then
                      kill -9 "$FIREFOX_PID" 2>/dev/null
                  fi

                  log "Kiosk Firefox closed."
                  exit 0
              fi

          done

          log "Kiosk Firefox exited."
          exit 0

    - name: Create system-wide XDG autostart entry
      ansible.builtin.copy:
        dest: "{{ desktop_file }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Desktop Entry]
          Type=Application
          Name=Security Awareness Kiosk
          Comment=Security Awareness Training
          Exec=/opt/security-awareness/kiosk-launcher-linux.sh
          Terminal=false
          StartupNotify=false
          X-GNOME-Autostart-enabled=true
          X-Cinnamon-Autostart-enabled=true
          X-XFCE-Autostart-enabled=true

    - name: Remove old per-user autostart if present
      ansible.builtin.shell: |
        find /home -maxdepth 3 \
          -type f \
          -path "*/.config/autostart/security-awareness-kiosk.desktop" \
          -delete
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify launcher exists
      ansible.builtin.stat:
        path: "{{ launcher_path }}"
      register: launcher_stat

    - name: Verify desktop entry exists
      ansible.builtin.stat:
        path: "{{ desktop_file }}"
      register: desktop_stat

    - name: Show deployment result
      ansible.builtin.debug:
        msg:
          - "Security Awareness kiosk configured."
          - "Launcher: {{ launcher_path }}"
          - "System-wide autostart: {{ desktop_file }}"
          - "Launcher exists: {{ launcher_stat.stat.exists }}"
          - "Desktop entry exists: {{ desktop_stat.stat.exists }}"
          - "No user-specific autologin configured."
          - "Works when any user starts a Cinnamon/XFCE graphical session."

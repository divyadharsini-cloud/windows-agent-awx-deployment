---
- name: Configure Security Awareness Kiosk at system startup
  hosts: ansibletesting
  become: true
  gather_facts: true

  vars:
    kiosk_user: "adminit"
    kiosk_home: "/home/adminit"

    kiosk_dir: "/opt/security-awareness"
    launcher: "/opt/security-awareness/kiosk-launcher-linux.sh"

    backend_base: "http://172.17.6.142:5000/api/awareness"
    awareness_url: "http://172.17.6.142:5000/awareness.html"

    autostart_file: "/etc/xdg/autostart/security-awareness-kiosk.desktop"

  tasks:

    # ---------------------------------------------------------
    # 1. Install required packages
    # ---------------------------------------------------------
    - name: Install Firefox and curl
      ansible.builtin.apt:
        name:
          - firefox
          - curl
        state: present
        update_cache: true

    # ---------------------------------------------------------
    # 2. Create kiosk directory
    # ---------------------------------------------------------
    - name: Create kiosk directory
      ansible.builtin.file:
        path: "{{ kiosk_dir }}"
        state: directory
        owner: "{{ kiosk_user }}"
        group: "{{ kiosk_user }}"
        mode: "0755"

    # ---------------------------------------------------------
    # 3. Create launcher
    # ---------------------------------------------------------
    - name: Create Security Awareness launcher
      ansible.builtin.copy:
        dest: "{{ launcher }}"
        owner: "{{ kiosk_user }}"
        group: "{{ kiosk_user }}"
        mode: "0755"
        content: |
          #!/bin/bash

          LOG="/tmp/security-awareness-kiosk.log"

          echo "========================================" >> "$LOG"
          echo "$(date) : Kiosk startup" >> "$LOG"

          # Wait until Cinnamon desktop is ready
          for i in {1..30}; do
              if [ -n "$DISPLAY" ]; then
                  echo "$(date) : DISPLAY=$DISPLAY" >> "$LOG"
                  break
              fi

              sleep 2
          done

          if [ -z "$DISPLAY" ]; then
              echo "$(date) : No DISPLAY available" >> "$LOG"
              exit 0
          fi

          HOSTNAME=$(hostname)

          STATUS_URL="{{ backend_base }}/status?hostname=${HOSTNAME}"
          AWARENESS_URL="{{ awareness_url }}?host=${HOSTNAME}"

          echo "$(date) : Hostname=$HOSTNAME" >> "$LOG"
          echo "$(date) : STATUS_URL=$STATUS_URL" >> "$LOG"

          # Give desktop startup applications time to settle
          sleep 10

          # -------------------------------------------------
          # Check completion status
          # -------------------------------------------------
          RESPONSE=$(curl -s \
              --connect-timeout 2 \
              --max-time 2 \
              "$STATUS_URL")

          echo "$(date) : API response=$RESPONSE" >> "$LOG"

          # Backend unavailable = fail open
          if [ -z "$RESPONSE" ]; then
              echo "$(date) : Backend unavailable - exiting" >> "$LOG"
              exit 0
          fi

          # Already completed = don't open kiosk
          if echo "$RESPONSE" | grep -q '"completed":true'; then
              echo "$(date) : Awareness already completed" >> "$LOG"
              exit 0
          fi

          # -------------------------------------------------
          # Launch Firefox
          # -------------------------------------------------
          FIREFOX=""

          if [ -x "/usr/bin/firefox" ]; then
              FIREFOX="/usr/bin/firefox"
          elif [ -x "/snap/bin/firefox" ]; then
              FIREFOX="/snap/bin/firefox"
          else
              FIREFOX=$(command -v firefox 2>/dev/null)
          fi

          if [ -z "$FIREFOX" ]; then
              echo "$(date) : Firefox not found" >> "$LOG"
              exit 0
          fi

          PROFILE="$HOME/.security-awareness-firefox"

          mkdir -p "$PROFILE"

          echo "$(date) : Launching Firefox kiosk" >> "$LOG"
          echo "$(date) : URL=$AWARENESS_URL" >> "$LOG"

          "$FIREFOX" \
              --no-remote \
              --profile "$PROFILE" \
              --kiosk \
              "$AWARENESS_URL" \
              >> "$LOG" 2>&1 &

          FIREFOX_PID=$!

          echo "$(date) : Firefox PID=$FIREFOX_PID" >> "$LOG"

          # -------------------------------------------------
          # Monitor completion
          # -------------------------------------------------
          while kill -0 "$FIREFOX_PID" 2>/dev/null; do

              sleep 2

              RESPONSE=$(curl -s \
                  --connect-timeout 2 \
                  --max-time 2 \
                  "$STATUS_URL")

              echo "$(date) : Poll response=$RESPONSE" >> "$LOG"

              if echo "$RESPONSE" | grep -q '"completed":true'; then

                  echo "$(date) : Test completed" >> "$LOG"

                  # Keep score/result visible for 8 seconds
                  sleep 8

                  echo "$(date) : Closing kiosk Firefox" >> "$LOG"

                  kill "$FIREFOX_PID" 2>/dev/null || true

                  sleep 3

                  kill -9 "$FIREFOX_PID" 2>/dev/null || true

                  break
              fi

          done

          echo "$(date) : Kiosk finished" >> "$LOG"

    # ---------------------------------------------------------
    # 4. Create system-wide GUI autostart
    # ---------------------------------------------------------
    - name: Create XDG autostart entry
      ansible.builtin.copy:
        dest: "{{ autostart_file }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Desktop Entry]
          Type=Application
          Name=Security Awareness Kiosk
          Comment=Security Awareness Training
          Exec={{ launcher }}
          Terminal=false
          NoDisplay=false
          StartupNotify=false
          X-GNOME-Autostart-enabled=true
          X-Cinnamon-Autostart-enabled=true

    # ---------------------------------------------------------
    # 5. Configure automatic login for Linux Mint
    # ---------------------------------------------------------
    - name: Check LightDM configuration
      ansible.builtin.stat:
        path: /etc/lightdm/lightdm.conf
      register: lightdm_conf

    - name: Enable automatic login in LightDM
      ansible.builtin.blockinfile:
        path: /etc/lightdm/lightdm.conf
        marker: "# {mark} ANSIBLE SECURITY AWARENESS AUTOLOGIN"
        block: |
          [Seat:*]
          autologin-user={{ kiosk_user }}
          autologin-user-timeout=0
      when: lightdm_conf.stat.exists

    # ---------------------------------------------------------
    # 6. Ensure ownership
    # ---------------------------------------------------------
    - name: Ensure kiosk home ownership
      ansible.builtin.file:
        path: "{{ kiosk_home }}"
        owner: "{{ kiosk_user }}"
        group: "{{ kiosk_user }}"
        recurse: false

    # ---------------------------------------------------------
    # 7. Remove old systemd kiosk services
    # ---------------------------------------------------------
    - name: Remove old user systemd service
      ansible.builtin.file:
        path: /etc/systemd/user/security-awareness-kiosk.service
        state: absent

    - name: Remove old system systemd service
      ansible.builtin.file:
        path: /etc/systemd/system/security-awareness-kiosk.service
        state: absent

    # ---------------------------------------------------------
    # 8. Reboot
    # ---------------------------------------------------------
    - name: Reboot machine
      ansible.builtin.reboot:
        reboot_timeout: 300
        post_reboot_delay: 10

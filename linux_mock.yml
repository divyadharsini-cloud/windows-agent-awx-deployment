---
- name: Deploy Security Awareness Native Desktop Application
  hosts: ansibletesting
  become: true
  gather_facts: true

  vars:
    app_dir: /opt/security-awareness
    app_path: /opt/security-awareness/security-awareness-app.py
    desktop_file: /etc/xdg/autostart/security-awareness.desktop

    backend_base: "http://172.17.6.142:5000/api/awareness"
    awareness_page: "http://172.17.6.142:5000/awareness.html"

  tasks:

    # ---------------------------------------------------------
    # 1. Install required Linux GUI components
    # ---------------------------------------------------------

    - name: Install GTK and WebKit dependencies
      ansible.builtin.apt:
        name:
          - python3
          - python3-gi
          - python3-cairo
          - gir1.2-gtk-3.0
          - gir1.2-webkit2-4.1
          - curl
        state: present
        update_cache: true


    # ---------------------------------------------------------
    # 2. Create application directory
    # ---------------------------------------------------------

    - name: Create Security Awareness application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"


    # ---------------------------------------------------------
    # 3. Remove old Firefox launcher
    # ---------------------------------------------------------

    - name: Remove old Firefox kiosk launcher
      ansible.builtin.file:
        path: /opt/security-awareness/kiosk-launcher-linux.sh
        state: absent


    - name: Remove old Firefox autostart
      ansible.builtin.file:
        path: /etc/xdg/autostart/security-awareness-kiosk.desktop
        state: absent


    # ---------------------------------------------------------
    # 4. Create native GTK/WebKit application
    # ---------------------------------------------------------

    - name: Create Security Awareness native application
      ansible.builtin.copy:
        dest: "{{ app_path }}"
        owner: root
        group: root
        mode: "0755"

        content: |
          #!/usr/bin/env python3

          import os
          import sys
          import time
          import socket
          import subprocess

          import gi

          gi.require_version("Gtk", "3.0")
          gi.require_version("WebKit2", "4.1")

          from gi.repository import Gtk, GLib, WebKit2


          # =========================================================
          # Configuration
          # =========================================================

          BACKEND_BASE = "{{ backend_base }}"
          AWARENESS_PAGE = "{{ awareness_page }}"

          HOSTNAME = socket.gethostname()

          STATUS_URL = (
              BACKEND_BASE
              + "/status?hostname="
              + HOSTNAME
          )

          AWARENESS_URL = (
              AWARENESS_PAGE
              + "?host="
              + HOSTNAME
          )

          POLL_INTERVAL = 2
          RESULT_DISPLAY_SECONDS = 8

          LOG_FILE = (
              "/tmp/security-awareness-native-"
              + str(os.getuid())
              + ".log"
          )


          # =========================================================
          # Logging
          # =========================================================

          def log(message):
              timestamp = time.strftime("%Y-%m-%d %H:%M:%S")

              try:
                  with open(LOG_FILE, "a") as f:
                      f.write(
                          timestamp
                          + " "
                          + message
                          + "\n"
                      )
              except Exception:
                  pass


          # =========================================================
          # Backend status
          # =========================================================

          def check_backend():

              try:

                  result = subprocess.run(
                      [
                          "curl",
                          "--silent",
                          "--show-error",
                          "--connect-timeout",
                          "2",
                          "--max-time",
                          "2",
                          STATUS_URL
                      ],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                      timeout=3
                  )

                  if result.returncode != 0:

                      log(
                          "Backend unavailable. "
                          "Return code="
                          + str(result.returncode)
                      )

                      return None

                  response = result.stdout.strip()

                  log(
                      "Backend response: "
                      + response
                  )

                  if '"completed":true' in response:

                      return True

                  if '"completed": true' in response:

                      return True

                  return False

              except Exception as e:

                  log(
                      "Backend check exception: "
                      + str(e)
                  )

                  return None


          # =========================================================
          # Main GTK Application
          # =========================================================

          class SecurityAwarenessApp:

              def __init__(self):

                  log("==============================================")
                  log("Security Awareness Native Application started")
                  log("USER=" + os.environ.get("USER", ""))
                  log("UID=" + str(os.getuid()))
                  log("HOME=" + os.environ.get("HOME", ""))
                  log("HOSTNAME=" + HOSTNAME)
                  log("STATUS_URL=" + STATUS_URL)
                  log("AWARENESS_URL=" + AWARENESS_URL)
                  log("==============================================")


                  # -------------------------------------------------
                  # Initial backend check
                  # -------------------------------------------------

                  status = check_backend()

                  if status is None:

                      log(
                          "Backend unavailable initially."
                      )

                      log(
                          "Failing open."
                      )

                      log(
                          "Application will NOT open."
                      )

                      sys.exit(0)


                  if status is True:

                      log(
                          "Security awareness already completed."
                      )

                      log(
                          "Application will NOT open."
                      )

                      sys.exit(0)


                  log(
                      "Security awareness is pending."
                  )

                  log(
                      "Starting native application."
                  )


                  # -------------------------------------------------
                  # GTK Window
                  # -------------------------------------------------

                  self.window = Gtk.Window(
                      title="Security Awareness Training"
                  )

                  self.window.set_default_size(
                      1100,
                      700
                  )

                  self.window.set_position(
                      Gtk.WindowPosition.CENTER
                  )

                  self.window.set_resizable(True)

                  self.window.set_keep_above(True)

                  self.window.set_modal(True)

                  self.window.connect(
                      "delete-event",
                      self.prevent_close
                  )


                  # -------------------------------------------------
                  # WebKit browser engine
                  #
                  # This is NOT Firefox.
                  # The awareness page is embedded directly inside
                  # this Linux application window.
                  # -------------------------------------------------

                  self.webview = WebKit2.WebView()

                  settings = self.webview.get_settings()

                  settings.set_enable_javascript(True)

                  settings.set_enable_plugins(False)

                  settings.set_enable_webgl(True)

                  settings.set_allow_file_access_from_file_urls(False)

                  settings.set_allow_universal_access_from_file_urls(False)


                  # -------------------------------------------------
                  # Load awareness application
                  # -------------------------------------------------

                  self.webview.load_uri(
                      AWARENESS_URL
                  )


                  self.window.add(
                      self.webview
                  )


                  # -------------------------------------------------
                  # Show application
                  # -------------------------------------------------

                  self.window.show_all()


                  log(
                      "Native Security Awareness window opened."
                  )


                  # -------------------------------------------------
                  # Start backend polling
                  # -------------------------------------------------

                  GLib.timeout_add_seconds(
                      POLL_INTERVAL,
                      self.poll_status
                  )


              # =====================================================
              # Prevent user from closing the awareness application
              # =====================================================

              def prevent_close(
                  self,
                  widget,
                  event
              ):

                  log(
                      "User attempted to close application."
                  )

                  return True


              # =====================================================
              # Poll backend
              # =====================================================

              def poll_status(self):

                  status = check_backend()


                  # -----------------------------------------------
                  # Backend temporarily unavailable
                  # -----------------------------------------------

                  if status is None:

                      log(
                          "Backend temporarily unavailable."
                      )

                      log(
                          "Keeping application open."
                      )

                      return True


                  # -----------------------------------------------
                  # Test completed
                  # -----------------------------------------------

                  if status is True:

                      log(
                          "=============================================="
                      )

                      log(
                          "Security awareness completed."
                      )

                      log(
                          "Keeping result visible for "
                          + str(RESULT_DISPLAY_SECONDS)
                          + " seconds."
                      )

                      log(
                          "=============================================="
                      )


                      # Stop polling

                      self.show_completed_message()


                      GLib.timeout_add_seconds(
                          RESULT_DISPLAY_SECONDS,
                          self.close_application
                      )


                      return False


                  # -----------------------------------------------
                  # Still pending
                  # -----------------------------------------------

                  log(
                      "Security awareness still pending."
                  )

                  return True


              # =====================================================
              # Completion message
              # =====================================================

              def show_completed_message(self):

                  log(
                      "Completion detected."
                  )

                  # Do not replace the test page.
                  # The score/result remains visible.

                  self.window.set_title(
                      "Security Awareness Training - Completed"
                  )


              # =====================================================
              # Close application
              # =====================================================

              def close_application(self):

                  log(
                      "Closing Security Awareness application."
                  )

                  self.window.destroy()

                  Gtk.main_quit()

                  return False


          # =========================================================
          # Start application
          # =========================================================

          try:

              app = SecurityAwarenessApp()

              Gtk.main()

          except SystemExit:

              raise

          except Exception as e:

              log(
                  "FATAL APPLICATION ERROR: "
                  + str(e)
              )

              sys.exit(0)


    # ---------------------------------------------------------
    # 5. Create system-wide autostart
    # ---------------------------------------------------------

    - name: Create system-wide Security Awareness autostart
      ansible.builtin.copy:
        dest: "{{ desktop_file }}"
        owner: root
        group: root
        mode: "0644"

        content: |
          [Desktop Entry]
          Type=Application
          Name=Security Awareness Training
          Comment=Security Awareness Mock Test
          Exec=/usr/bin/python3 /opt/security-awareness/security-awareness-app.py
          Terminal=false
          StartupNotify=true

          X-GNOME-Autostart-enabled=true
          X-Cinnamon-Autostart-enabled=true
          X-XFCE-Autostart-enabled=true


    # ---------------------------------------------------------
    # 6. Remove previous per-user autostart
    # ---------------------------------------------------------

    - name: Remove old per-user Security Awareness autostart
      ansible.builtin.shell: |
        for home_dir in /home/*; do
          if [ -d "$home_dir/.config/autostart" ]; then
            rm -f "$home_dir/.config/autostart/security-awareness-kiosk.desktop"
          fi
        done
      args:
        executable: /bin/bash
      changed_when: false


    # ---------------------------------------------------------
    # 7. Remove old automatic login configuration
    # ---------------------------------------------------------

    - name: Remove Security Awareness automatic login configuration
      ansible.builtin.file:
        path: /etc/lightdm/lightdm.conf.d/90-security-awareness-autologin.conf
        state: absent


    # ---------------------------------------------------------
    # 8. Verify Python application
    # ---------------------------------------------------------

    - name: Verify native application exists
      ansible.builtin.stat:
        path: "{{ app_path }}"
      register: app_stat


    # ---------------------------------------------------------
    # 9. Verify autostart
    # ---------------------------------------------------------

    - name: Verify system autostart exists
      ansible.builtin.stat:
        path: "{{ desktop_file }}"
      register: desktop_stat


    # ---------------------------------------------------------
    # 10. Verify GTK/WebKit
    # ---------------------------------------------------------

    - name: Verify GTK Python support
      ansible.builtin.command:
        cmd: python3 -c "import gi; gi.require_version('Gtk','3.0'); from gi.repository import Gtk"
      register: gtk_check
      changed_when: false
      failed_when: false


    - name: Verify WebKit Python support
      ansible.builtin.command:
        cmd: python3 -c "import gi; gi.require_version('WebKit2','4.1'); from gi.repository import WebKit2"
      register: webkit_check
      changed_when: false
      failed_when: false


    # ---------------------------------------------------------
    # 11. Deployment result
    # ---------------------------------------------------------

    - name: Show deployment result
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "Security Awareness Native Application Deployed"
          - "=================================================="
          - "Application: {{ app_path }}"
          - "Application exists: {{ app_stat.stat.exists }}"
          - "Autostart: {{ desktop_file }}"
          - "Autostart exists: {{ desktop_stat.stat.exists }}"
          - "GTK support: {{ 'OK' if gtk_check.rc == 0 else 'FAILED' }}"
          - "WebKit support: {{ 'OK' if webkit_check.rc == 0 else 'FAILED' }}"
          - "Backend: {{ backend_base }}"
          - "Awareness page: {{ awareness_page }}"
          - "Desktop support: XFCE + Cinnamon"
          - "Applies to: ALL GUI USERS"
          - "Firefox: NOT USED"
          - "Automatic login: DISABLED"
          - "Backend unavailable initially: FAIL OPEN"
          - "Status polling: Every 2 seconds"
          - "Result display: 8 seconds"
          - "=================================================="

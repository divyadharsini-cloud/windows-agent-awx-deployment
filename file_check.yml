---
- name: Check AuroSphere Patch Download Status
  hosts: DPDYPHGFDAY0536
  gather_facts: false

  vars:
    patch_file: 'C:\ProgramData\windows-agent-patch\patch\downloads\KB5121003.bin.part'
    agent_log: 'C:\ProgramData\windows-agent\logs\agent.log'

  tasks:

    # --------------------------------------------------
    # Check partial download file
    # --------------------------------------------------

    - name: Check KB5121003 partial download
      ansible.windows.win_stat:
        path: "{{ patch_file }}"
      register: patch_download

    - name: Display patch download status
      debug:
        msg:
          - "=============================================="
          - "AuroSphere Patch Download Status"
          - "=============================================="
          - "File exists      : {{ patch_download.stat.exists | default(false) }}"
          - "Downloaded bytes : {{ patch_download.stat.size | default(0) }}"
          - "Downloaded GB    : {{ ((patch_download.stat.size | default(0)) / 1073741824) | round(2) }}"
          - "Last modified    : {{ patch_download.stat.last_write_time | default('N/A') }}"
          - "Expected package : approximately 5.10 GB"
          - "=============================================="

    # --------------------------------------------------
    # Check agent service
    # --------------------------------------------------

    - name: Check windows-agent service
      ansible.windows.win_service:
        name: windows-agent
      register: agent_service

    - name: Display agent service status
      debug:
        msg:
          - "Windows Agent service : {{ agent_service.state }}"
          - "Startup type          : {{ agent_service.start_mode }}"

    # --------------------------------------------------
    # Check relevant patch download logs
    # --------------------------------------------------

    - name: Check AuroSphere patch download logs
      ansible.windows.win_shell: |
        if (Test-Path "{{ agent_log }}") {
            Get-Content "{{ agent_log }}" |
            Select-String "patch partial file found|patch download starting|patch download resuming|patch download resume accepted|patch download interrupted|patch download transfer completed|patch download finalized"
        }
        else {
            Write-Output "Agent log file not found"
        }
      register: patch_log
      changed_when: false

    - name: Display patch download logs
      debug:
        var: patch_log.stdout_lines

    # --------------------------------------------------
    # Final result
    # --------------------------------------------------

    - name: Show final result
      debug:
        msg: >-
          {% if patch_download.stat.exists | default(false) %}
          KB5121003 partial download exists.
          Current size: {{ ((patch_download.stat.size | default(0)) / 1073741824) | round(2) }} GB.
          {% else %}
          KB5121003 .part file does not currently exist.
          {% endif %}

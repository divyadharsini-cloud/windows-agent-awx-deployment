- name: Check patch download
  hosts: DPDYPHGFDAY0536
  gather_facts: false

  tasks:
    - name: Check downloaded patch files
      ansible.windows.win_shell: |
        Get-ChildItem "C:\ProgramData\windows-agent-patch\patch\downloads" -Force |
        Select-Object Name, Length, LastWriteTime
      register: result
      changed_when: false

    - debug:
        var: result.stdout_lines

---
- name: AuroSphere Patch Diagnosis
  hosts: DPDYPHGFDAY0536
  gather_facts: false

  tasks:

    - name: Show patch-related agent log lines
      ansible.windows.win_shell: |
        $log = "C:\ProgramData\windows-agent-patch\logs\agent.log"

        if (Test-Path $log) {
            Get-Content $log -Tail 500 |
              Select-String -Pattern "patch|KB5121003|metadata|evaluation|REQUIRED|INSTALL|download|400"
        }
        else {
            Write-Output "LOG_NOT_FOUND"
        }
      register: patch_log
      changed_when: false

    - name: Test PatchMaster approved API from endpoint
      ansible.windows.win_shell: |
        $url = "http://172.17.9.50:8443/api/v1/patches/approved?agent_id=DPDYPHGFDAY0536"

        try {
            $response = Invoke-WebRequest `
                -Uri $url `
                -UseBasicParsing `
                -TimeoutSec 30

            Write-Output "HTTP_STATUS=$($response.StatusCode)"
            Write-Output "RESPONSE=$($response.Content)"
        }
        catch {
            Write-Output "PATCHMASTER_ERROR=$($_.Exception.Message)"
        }
      register: patchmaster
      changed_when: false

    - name: Show agent executable information
      ansible.windows.win_shell: |
        $exe = "C:\Program Files\CustomAgent\windows-agent-patch\windows-agent-patch.exe"

        if (Test-Path $exe) {
            $f = Get-Item $exe

            Write-Output "EXE=$($f.FullName)"
            Write-Output "SIZE=$($f.Length)"
            Write-Output "LAST_WRITE=$($f.LastWriteTime)"
            Write-Output "VERSION=$($f.VersionInfo.FileVersion)"
        }
        else {
            Write-Output "EXE_NOT_FOUND"
        }
      register: exe_info
      changed_when: false

    - name: Show current patch configuration
      ansible.windows.win_shell: |
        $cfg = "C:\ProgramData\windows-agent-patch\config.yaml"

        if (Test-Path $cfg) {
            Get-Content $cfg |
              Select-String -Pattern "patch:|enabled:|interval_seconds:|master_url:|data_dir:|download_dir:|auto_install:|auto_reboot:"
        }
        else {
            Write-Output "CONFIG_NOT_FOUND"
        }
      register: config
      changed_when: false

    - name: Display diagnosis
      ansible.builtin.debug:
        msg:
          PATCH_LOG: "{{ patch_log.stdout }}"
          PATCHMASTER: "{{ patchmaster.stdout }}"
          EXE: "{{ exe_info.stdout }}"
          CONFIG: "{{ config.stdout }}"
